[package]
name = "fitgirl-downloader"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "fitgirl_downloader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["stream"] }
headless_chrome = { version = "1.0.21", features = ["rustls"] }

[profile.release]
panic = "abort"        # Kurangi binary, bagus untuk app
codegen-units = 1      # LTO + single unit = optimasi maksimal
lto = true             # Fat LTO: terbaik untuk binary final
opt-level = "s"        # Size-opt tapi lebih seimbang dari "z"
strip = true           # Hapus debug symbols — efek terbesar!
